<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>全院掛號管理工作台 - MiniClinic</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2c3e50;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #2c3e50;
            margin: 0;
            font-size: 24px;
        }
        .user-info {
            font-size: 14px;
            color: #7f8c8d;
        }
        .user-info strong {
            color: #2c3e50;
        }
        .nav-links {
            margin-bottom: 20px;
        }
        .nav-links a {
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            margin-right: 15px;
            font-size: 14px;
        }
        .nav-links a:hover {
            text-decoration: underline;
        }
        /* 表格排版 */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            background-color: #2c3e50;
            color: white;
            font-weight: 600;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        /* 狀態標籤 */
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge-booked { background-color: #e3f2fd; color: #0d47a1; }
        .badge-completed { background-color: #e8f5e9; color: #1b5e20; }
        .badge-cancelled { background-color: #ffebee; color: #c62828; }
        
        /* 按鈕樣式 */
        .btn-actions {
            display: flex;
            gap: 5px;
        }
        .btn {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn-success {
            background-color: #2ecc71;
            color: white;
        }
        .btn-success:hover { background-color: #27ae60; }
        
        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }
        .btn-danger:hover { background-color: #c0392b; }
        
        .no-data {
            text-align: center;
            color: #95a5a6;
            padding: 30px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📋 MiniClinic 全院預約掛號管理工作台</h1>
        <div class="user-info">
            當前登入醫師：<strong th:text="${doctor.name}">某醫師</strong> 
            (<span th:text="${doctor.department}">某科別</span>)
        </div>
    </div>

    <div class="nav-links">
        <a href="/dashboard">⬅️ 返回個人工作台</a>
        <a href="/stats">📊 前往全院統計儀表板</a>
    </div>

    <table>
        <thead>
            <tr>
                <th>掛號 ID</th>
                <th>就診日期</th>
                <th>病患姓名 (病歷號)</th>
                <th>主治醫師 (科別)</th>
                <th>目前狀態</th>
                <th>管理操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="appt : ${appointments}">
                <td th:text="${appt.apptId}">1</td>
                <td th:text="${appt.apptDate}">2026-06-14</td>
                <td>
                    <span th:text="${appt.patient.name}">張三</span>
                    (<span th:text="${appt.patient.chartNo}">CH12345</span>)
                </td>
                <td>
                    <span th:text="${appt.doctor.name}">李醫師</span>
                    (<span th:text="${appt.doctor.department}">內科</span>)
                </td>
                <td>
                    <span th:if="${appt.status == 'BOOKED'}" class="badge badge-booked">已預約 (BOOKED)</span>
                    <span th:if="${appt.status == 'COMPLETED'}" class="badge badge-completed">已就診 (COMPLETED)</span>
                    <span th:if="${appt.status == 'CANCELLED'}" class="badge badge-cancelled">已取消 (CANCELLED)</span>
                </td>
                <td>
                    <div class="btn-actions" th:if="${appt.status == 'BOOKED'}">
                        <form th:action="@{/appointments/update-status}" method="post" style="display:inline;">
                            <input type="hidden" name="apptId" th:value="${appt.apptId}" />
                            <input type="hidden" name="status" value="COMPLETED" />
                            <button type="submit" class="btn btn-success">完成就診</button>
                        </form>
                        
                        <form th:action="@{/appointments/update-status}" method="post" style="display:inline;">
                            <input type="hidden" name="apptId" th:value="${appt.apptId}" />
                            <input type="hidden" name="status" value="CANCELLED" />
                            <button type="submit" class="btn btn-danger">取消掛號</button>
                        </form>
                    </div>
                    <span th:unless="${appt.status == 'BOOKED'}" style="color: #95a5a6; font-size: 13px;">- 案件已結案 -</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(appointments)}">
                <td colspan="6" class="no-data">目前全院系統中無任何預約掛號紀錄。</td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
