<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>醫師工作台</title>
    <link rel="icon" href="data:,">
</head>
<body>

<h1>醫師工作台</h1>

<h2>
    歡迎，
    <span th:text="${doctor.name}"></span> 醫師
</h2>

<p>
    科別：
    <span th:text="${doctor.department}"></span>
</p>

<form th:action="@{/logout}" method="post">
    <button type="submit">登出</button>
</form>

<hr>

<h3>今日掛號清單</h3>
<table border="1">
    <thead>
        <tr>
            <th>掛號編號</th>
            <th>病歷號</th>
            <th>病患姓名</th>
            <th>日期</th>
            <th>時段</th>
            <th>狀態</th>
            <th>操作</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="appt : ${appointments}">
            <td th:text="${appt.apptId}"></td>
            <td th:text="${appt.patient.chartNo}"></td>
            <td th:text="${appt.patient.name}"></td>
            <td th:text="${appt.apptDate}"></td>
            <td th:text="${appt.timeSlot}"></td>
            <td th:text="${appt.status}"></td>
            <td>
                <button th:if="${appt.status == 'BOOKED'}"
                        th:data-id="${appt.apptId}"
                        onclick="completeAppointment(this)">
                    看診完成
                </button>

                <button th:if="${appt.status == 'BOOKED'}"
                        th:data-id="${appt.apptId}"
                        onclick="cancelAppointment(this)">
                    取消
                </button>
            </td>
        </tr>
    </tbody>
</table>

<p>
    <a th:href="@{/password}">修改密碼</a>
</p>
<p>
    <a th:href="@{/}">回首頁</a>
</p>

<script>
// 功能一：發送狀態 COMPLETED 更新
function completeAppointment(button) {
    const id = button.getAttribute("data-id");
    
    fetch("/api/appointments/" + id + "/status", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "COMPLETED" })
    }).then(function(response) {
        if (response.ok) {
            location.reload(); // 成功後重新整理頁面
        } else {
            alert("看診完成更新失敗");
        }
    }).catch(function(error) {
        console.error("發生錯誤:", error);
    });
}

// 既有功能：發送狀態 CANCELLED 更新
function cancelAppointment(button) {
    const id = button.getAttribute("data-id");
    
    fetch("/api/appointments/" + id + "/status", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: "CANCELLED" })
    }).then(function(response) {
        if (response.ok) {
            location.reload(); // 成功後重新整理頁面
        } else {
            alert("取消掛號失敗");
        }
    }).catch(function(error) {
        console.error("發生錯誤:", error);
    });
}
</script>

</body>
</html>
